name: Build APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Admin APK
        run: |
          cd Admin
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Admin APK
        uses: actions/upload-artifact@v3
        with:
          name: Admin-APK
          path: Admin/app/build/outputs/apk/debug/*.apk

  build-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build User APK
        run: |
          cd User
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload User APK
        uses: actions/upload-artifact@v3
        with:
          name: User-APK
          path: User/app/build/outputs/apk/debug/*.apk
