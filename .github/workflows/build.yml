name: Build Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x Admin/gradlew

      - name: Build Admin Debug APK
        run: |
          cd Admin
          ./gradlew assembleDebug

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Debug-APK
          path: Admin/app/build/outputs/apk/debug/*.apk
