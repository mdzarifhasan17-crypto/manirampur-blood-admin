name: Build Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # মিসিং .env.example এবং .env ফাইল স্বয়ংক্রিয়ভাবে তৈরি করার স্টেপ
      - name: Create missing .env files
        run: |
          touch .env.example
          touch .env
          if [ -d "Admin" ]; then
            touch Admin/.env.example
            touch Admin/.env
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "Admin/gradlew" ]; then
            chmod +x Admin/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Admin Debug APK
        run: |
          if [ -f "Admin/gradlew" ]; then
            cd Admin
            ./gradlew assembleDebug
          elif [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found to build!"
            exit 1
          fi

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Admin-Debug-APK
          path: |
            Admin/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
